<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A quick, clear calculator for adding two numbers." />
    <title>Add two numbers</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/calculator.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="calculator-panel" aria-labelledby="page-title">
        <div class="eyebrow">Simple arithmetic</div>
        <h1 id="page-title">Add two numbers.</h1>
        <p class="intro">Enter your values and get a clear answer, right away.</p>

        <form id="addition-form" novalidate>
          <div class="input-grid">
            <div class="field-group">
              <label for="first-number">First number</label>
              <input
                id="first-number"
                name="firstNumber"
                type="number"
                inputmode="decimal"
                step="any"
                autocomplete="off"
                placeholder="e.g. 12.5"
                aria-describedby="first-number-error"
              />
              <p class="field-error" id="first-number-error" role="alert"></p>
            </div>

            <div class="operator" aria-hidden="true">+</div>

            <div class="field-group">
              <label for="second-number">Second number</label>
              <input
                id="second-number"
                name="secondNumber"
                type="number"
                inputmode="decimal"
                step="any"
                autocomplete="off"
                placeholder="e.g. -3"
                aria-describedby="second-number-error"
              />
              <p class="field-error" id="second-number-error" role="alert"></p>
            </div>
          </div>

          <button type="submit" id="add-button">Add numbers <span aria-hidden="true">→</span></button>
        </form>

        <div class="result-panel" aria-live="polite" aria-atomic="true">
          <span class="result-label">Your result</span>
          <output id="result" for="first-number second-number">—</output>
        </div>
      </section>
      <p class="footer-note">No history. No distractions. Just the answer.</p>
    </main>
  </body>
</html>
